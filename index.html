<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDC Plant 2 - Master Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        petronas: { main: '#00A19C', dark: '#007A76', light: '#E6F6F5' }
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes pulse-red {
            0%, 100% { border-color: #E5E7EB; }
            50% { border-color: #EF4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
        }
        .alarm-border { animation: pulse-red 2s infinite; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen selection:bg-petronas-light">

    <!-- CRITICAL ALARM BANNER -->
    <div id="alarm-banner" class="hidden bg-red-600 text-white text-center py-1 sm:py-2 text-[10px] sm:text-sm font-bold tracking-wide uppercase transition-all duration-300 shadow-md w-full z-[60]">
        ⚠️ CAPACITY BELOW TARGET DEMAND! ⚠️
    </div>

    <div class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8">
        
        <!-- STICKY KPI HEADER -->
        <div class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-gray-200 pt-2 pb-2 mb-4 sm:pt-6 sm:pb-6 sm:mb-8 transition-all duration-300 shadow-sm" id="header-container">
            
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 sm:gap-4 mb-3 sm:mb-6">
                <!-- Title Block -->
                <div class="w-full md:w-auto flex items-center gap-2 sm:gap-3">
                    <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-gradient-to-br from-petronas-main to-petronas-dark flex items-center justify-center text-white font-bold text-base sm:text-xl shadow-md flex-shrink-0">⚡</div>
                    <div>
                        <h1 class="text-lg sm:text-2xl font-bold tracking-tight text-gray-900 leading-tight">GDC Plant 2 Ops</h1>
                        <p class="hidden sm:block text-gray-500 text-sm font-medium">Interactive Load & Import Sandbox</p>
                    </div>
                </div>
                
                <!-- Filters Block -->
                <div class="flex flex-col w-full md:w-auto items-start md:items-end gap-1.5 sm:gap-3">
                    
                    <!-- Demand & Custom Input Row -->
                    <div class="flex flex-wrap items-center gap-1.5 bg-gray-100 p-1 rounded-lg sm:rounded-xl border border-gray-200 shadow-inner w-full md:w-auto justify-start md:justify-end">
                        <div id="demand-filters" class="flex flex-nowrap overflow-x-auto hide-scrollbar gap-1"></div>
                        <div class="flex items-center gap-1 pl-1 border-l border-gray-300">
                            <span class="text-[10px] font-bold text-gray-500">Custom:</span>
                            <input type="number" id="custom-demand-input" placeholder="RT" oninput="updateCustomDemand(this.value)" 
                                class="w-20 text-right bg-white border border-gray-300 rounded px-1.5 py-1 text-[11px] font-bold text-gray-900 focus:outline-none focus:ring-1 focus:ring-petronas-main" />
                        </div>
                    </div>

                    <div id="year-filters" class="flex flex-nowrap overflow-x-auto w-full md:w-auto hide-scrollbar justify-start md:justify-end gap-1 bg-gray-100 p-1 rounded-lg sm:rounded-xl border border-gray-200 shadow-inner"></div>
                </div>
            </div>
            
            <!-- KPI CARDS -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 sm:gap-4">
                
                <!-- Target vs Output -->
                <div id="kpi-rt-card" class="bg-white p-2 sm:p-4 rounded-lg sm:rounded-xl border border-gray-200 shadow-sm transition-all duration-300">
                    <div class="text-gray-400 text-[9px] sm:text-xs font-bold uppercase tracking-wider mb-0.5 sm:mb-1">Target vs Output</div>
                    <div class="text-base sm:text-3xl font-black flex items-baseline gap-1 leading-none">
                        <span id="kpi-target" class="text-gray-400 text-xs sm:text-xl"></span>
                        <span id="kpi-rt" class="text-petronas-main">0</span>
                        <span class="text-[10px] sm:text-base text-gray-500 font-bold">RT</span>
                    </div>
                    <div id="kpi-tes-note" class="text-[8px] sm:text-xs text-petronas-main font-bold mt-1 sm:mt-1 h-3 sm:h-4"></div>
                </div>

                <!-- Total Plant Load -->
                <div class="bg-white p-2 sm:p-4 rounded-lg sm:rounded-xl border border-gray-200 shadow-sm">
                    <div class="text-gray-400 text-[9px] sm:text-xs font-bold uppercase tracking-wider mb-0.5 sm:mb-1">Plant Load</div>
                    <div id="kpi-load" class="text-base sm:text-3xl font-black text-gray-800 leading-none mt-1 sm:mt-0">0.00 MW</div>
                </div>

                <!-- GTG Gen -->
                <div class="bg-white p-2 sm:p-4 rounded-lg sm:rounded-xl border border-gray-200 shadow-sm relative">
                    <div class="text-gray-400 text-[9px] sm:text-xs font-bold uppercase tracking-wider mb-0.5 sm:mb-1">GTG Gen</div>
                    <div id="kpi-gen" class="text-base sm:text-3xl font-black text-petronas-main leading-none mt-1 sm:mt-0">0.00 MW</div>
                    <div id="kpi-gen-note" class="text-[8px] sm:text-xs text-orange-500 font-bold mt-1 sm:mt-1 h-3 sm:h-4 hidden">Load Capped (Island)</div>
                </div>

                <!-- Net Import -->
                <div class="bg-white p-2 sm:p-4 rounded-lg sm:rounded-xl border border-gray-200 shadow-sm relative overflow-hidden">
                    <div class="absolute right-0 top-0 w-1 sm:w-1.5 h-full bg-gray-300"></div>
                    <div class="text-gray-400 text-[9px] sm:text-xs font-bold uppercase tracking-wider mb-0.5 sm:mb-1">Net TNB</div>
                    <div id="kpi-net" class="text-base sm:text-3xl font-black text-gray-800 leading-none mt-1 sm:mt-0">0.00 MW</div>
                </div>

            </div>
        </div>

        <!-- EQUIPMENT TOGGLES CONTAINER -->
        <div id="equipment-container" class="pb-10 sm:pb-20"></div>

    </div>

    <script>
        const EQUIPMENT = [
            { id: "ECC-A", type: "ECC", kw: 1065.0, rt: 1100, years: [2026,2027,2028,2029,2030] },
            { id: "ECC-B", type: "ECC", kw: 1102.0, rt: 1250, years: [2026,2027,2028,2029,2030] },
            { id: "ECC-C", type: "ECC", kw: 2245.0, rt: 3000, years: [2026,2027,2028,2029,2030] },
            { id: "ECC-L", type: "ECC", kw: 1860.0, rt: 2494, years: [2026,2027,2028,2029,2030] },
            { id: "ECC-D (New)", type: "ECC", kw: 1860.0, rt: 2500, years: [2027,2028,2029,2030] },
            { id: "ECC-G (New)", type: "ECC", kw: 1860.0, rt: 2500, years: [2027,2028,2029,2030] },
            { id: "ECC-B (New)", type: "ECC", kw: 1860.0, rt: 2500, years: [2027,2028,2029,2030] },
            { id: "ECC-F (New)", type: "ECC", kw: 1860.0, rt: 2500, years: [2027,2028,2029,2030] },
            { id: "ECC-E (New)", type: "ECC", kw: 1860.0, rt: 2500, years: [2028,2029,2030] },

            { id: "SAC-B", type: "SAC", kw: 260.0, rt: 850, years: [2026] },
            { id: "SAC-C", type: "SAC", kw: 485.0, rt: 2400, years: [2026,2027,2028,2029,2030] },
            { id: "SAC-D", type: "SAC", kw: 260.0, rt: 900, years: [2026] },
            { id: "SAC-E", type: "SAC", kw: 485.0, rt: 700, years: [2026,2027] },
            { id: "SAC-F", type: "SAC", kw: 485.0, rt: 1200, years: [2026] },
            { id: "SAC-H", type: "SAC", kw: 485.0, rt: 2000, years: [2026,2027,2028] },
            { id: "SAC-J", type: "SAC", kw: 485.0, rt: 2250, years: [2026,2027,2028,2029,2030] },
            { id: "SAC-K", type: "SAC", kw: 524.0, rt: 2200, years: [2026,2027] },
            
            { id: "DFC-A", type: "DFC", kw: 275.8, rt: 900, years: [2026] },
            { id: "DFC-B", type: "DFC", kw: 275.8, rt: 1000, years: [2026] },
            
            { id: "GTG-A", type: "Generator", kw: 236.9, rt: 0, gen: 5300, years: [2026,2027,2028] },
            { id: "GTG-B", type: "Generator", kw: 225.9, rt: 0, gen: 5300, years: [2026,2027,2028] },
            
            { id: "AGB-A", type: "Boiler", kw: 13.0, rt: 0, years: [2026,2027,2028,2029] },
            { id: "AGB-B", type: "Boiler", kw: 13.0, rt: 0, years: [2026,2027,2028,2029] },
            { id: "AGB-C", type: "Boiler", kw: 13.0, rt: 0, years: [2026,2027] },
            
            { id: "P-0101A", type: "SecPump", kw: 260.0, rt: 0, years: [2026,2027,2028,2029,2030] },
            { id: "P-0101B", type: "SecPump", kw: 260.0, rt: 0, years: [2026,2027,2028,2029,2030] },
            { id: "P-0101C", type: "SecPump", kw: 260.0, rt: 0, years: [2026,2027,2028,2029,2030] },
            { id: "P-0101D", type: "SecPump", kw: 260.0, rt: 0, years: [2026,2027,2028,2029,2030] },
            { id: "P-0101E", type: "SecPump", kw: 260.0, rt: 0, years: [2026,2027,2028,2029,2030] },
            { id: "P-0101F", type: "SecPump", kw: 260.0, rt: 0, years: [2026,2027,2028,2029,2030] },
            { id: "P-0101G", type: "SecPump", kw: 260.0, rt: 0, years: [2026,2027,2028,2029,2030] },

            { id: "Fixed Loads", type: "Fixed", kw: 455.1, rt: 0, years: [2026,2027,2028,2029,2030] }
        ];

        const DEMANDS = [
            { label: "Peak (30k)", value: 30000, tesRT: 8500 },
            { label: "Normal (26.5k)", value: 26500, tesRT: 8500 },
            { label: "Night (15k)", value: 15000, tesRT: 0 }
        ];

        let currentYear = 2026;
        let currentDemandValue = DEMANDS[1].value; 
        let currentTesRT = DEMANDS[1].tesRT;
        let customDemandActive = false;

        let equipmentState = {};
        let customRTState = {}; 
        
        function applyYearDefaults(year) {
            EQUIPMENT.forEach(eq => {
                if (eq.years.includes(year)) {
                    equipmentState[eq.id] = (eq.type !== "Boiler");
                } else {
                    equipmentState[eq.id] = false;
                }
            });
        }

        function updateCustomRT(id, value) {
            customRTState[id] = value;
            calculateKPIs();
        }

        function setPresetDemand(demandObj) {
            customDemandActive = false;
            currentDemandValue = demandObj.value;
            currentTesRT = demandObj.tesRT;
            document.getElementById('custom-demand-input').value = '';
            renderDemandFilters();
            calculateKPIs();
        }

        function updateCustomDemand(val) {
            if (val !== '') {
                let parsed = parseFloat(val);
                if (!isNaN(parsed)) {
                    customDemandActive = true;
                    currentDemandValue = parsed;
                    // Assume custom demand inherits normal day TES logic unless night selected, but keep it flexible: default TES to 8500 if > 15000, else 0
                    currentTesRT = currentDemandValue > 18000 ? 8500 : 0;
                    renderDemandFilters();
                    calculateKPIs();
                }
            } else {
                setPresetDemand(DEMANDS[1]); // Revert to normal if cleared
            }
        }

        function calculateKPIs() {
            let totalRT = currentTesRT; 
            let totalLoadKW = 0;
            let maxGtgCapacityKW = 0;

            EQUIPMENT.forEach(eq => {
                if (eq.years.includes(currentYear) && equipmentState[eq.id]) {
                    let activeRT = eq.rt;
                    if (customRTState[eq.id] !== undefined && customRTState[eq.id] !== '') {
                        let parsedRT = parseFloat(customRTState[eq.id]);
                        if (!isNaN(parsedRT)) activeRT = parsedRT;
                    }

                    totalRT += activeRT;
                    totalLoadKW += eq.kw;
                    if (eq.type === "Generator" && eq.gen) {
                        maxGtgCapacityKW += eq.gen;
                    }
                }
            });

            let actualGtgGenKW = Math.min(maxGtgCapacityKW, totalLoadKW);
            let netImportKW = totalLoadKW - actualGtgGenKW;

            document.getElementById('kpi-load').innerText = (totalLoadKW / 1000).toFixed(2) + " MW";
            document.getElementById('kpi-gen').innerText = (actualGtgGenKW / 1000).toFixed(2) + " MW";
            
            if (maxGtgCapacityKW > totalLoadKW) {
                document.getElementById('kpi-gen-note').classList.remove('hidden');
            } else {
                document.getElementById('kpi-gen-note').classList.add('hidden');
            }

            let netEl = document.getElementById('kpi-net');
            netEl.innerText = (netImportKW / 1000).toFixed(2) + " MW";
            if(netImportKW <= 0) {
                netEl.className = "text-base sm:text-3xl font-black text-petronas-main mt-1 sm:mt-0 leading-none";
            } else if (netImportKW > 10000) {
                netEl.className = "text-base sm:text-3xl font-black text-red-500 mt-1 sm:mt-0 leading-none";
            } else {
                netEl.className = "text-base sm:text-3xl font-black text-orange-500 mt-1 sm:mt-0 leading-none";
            }

            const rtEl = document.getElementById('kpi-rt');
            document.getElementById('kpi-target').innerText = currentDemandValue.toLocaleString() + "/";
            rtEl.innerText = totalRT.toLocaleString();
            
            if (currentTesRT > 0) {
                document.getElementById('kpi-tes-note').innerText = `+${currentTesRT.toLocaleString()} RT TES included`;
            } else {
                document.getElementById('kpi-tes-note').innerText = ``;
            }

            const banner = document.getElementById('alarm-banner');
            const rtCard = document.getElementById('kpi-rt-card');
            
            if (totalRT < currentDemandValue) {
                banner.classList.remove('hidden');
                rtEl.classList.replace('text-petronas-main', 'text-red-600');
                rtCard.classList.add('alarm-border');
            } else {
                banner.classList.add('hidden');
                rtEl.classList.replace('text-red-600', 'text-petronas-main');
                rtCard.classList.remove('alarm-border');
            }
        }

        function renderYearButtons() {
            const container = document.getElementById('year-filters');
            container.innerHTML = '';
            [2026, 2027, 2028, 2029, 2030].forEach(y => {
                const btn = document.createElement('button');
                btn.innerText = y;
                btn.className = `flex-shrink-0 px-3 sm:px-4 py-1 sm:py-1.5 rounded-md sm:rounded-lg text-[11px] sm:text-sm font-bold transition-all duration-200 ${y === currentYear ? 'bg-white text-petronas-dark shadow-sm ring-1 ring-gray-200' : 'bg-transparent text-gray-500 hover:text-gray-900'}`;
                btn.onclick = () => { 
                    currentYear = y; 
                    applyYearDefaults(currentYear);
                    customRTState = {}; 
                    renderYearButtons(); 
                    renderEquipment(); 
                    calculateKPIs(); 
                };
                container.appendChild(btn);
            });
        }

        function renderDemandFilters() {
            const container = document.getElementById('demand-filters');
            container.innerHTML = '';
            DEMANDS.forEach(d => {
                const isActive = !customDemandActive && d.value === currentDemandValue;
                const btn = document.createElement('button');
                btn.innerHTML = `${d.label}`;
                btn.className = `flex-shrink-0 px-2 sm:px-3 py-1 sm:py-1.5 rounded-md sm:rounded-lg text-[10px] sm:text-xs font-bold transition-all duration-200 ${isActive ? 'bg-white text-petronas-dark shadow-sm ring-1 ring-gray-200' : 'bg-transparent text-gray-500 hover:text-gray-900'}`;
                btn.onclick = () => setPresetDemand(d);
                container.appendChild(btn);
            });
        }

        function toggleEq(id) {
            equipmentState[id] = !equipmentState[id];
            renderEquipment();
            calculateKPIs();
        }

        function renderCategory(title, type) {
            const items = EQUIPMENT.filter(eq => eq.type === type && eq.years.includes(currentYear));
            if (items.length === 0) return ''; 
            
            let html = `
            <div class="mb-6 sm:mb-8">
                <h3 class="text-sm sm:text-lg font-bold text-gray-800 border-b border-gray-200 pb-1 sm:pb-2 mb-3 sm:mb-4">${title}</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4">
            `;
            
            items.forEach(eq => {
                const isOn = equipmentState[eq.id];
                const loadText = eq.type === 'Generator' ? `Cap: ${(eq.gen/1000).toFixed(2)} MW` : `Load: ${(eq.kw/1000).toFixed(2)} MW`;
                
                let rtInputHtml = '';
                if (eq.rt > 0) {
                    let currentVal = customRTState[eq.id] !== undefined ? customRTState[eq.id] : '';
                    let inputState = !isOn ? 'disabled opacity-40' : '';
                    rtInputHtml = `
                    <div class="flex items-center gap-1.5 mr-2">
                        <input type="number" min="0" value="${currentVal}" placeholder="${eq.rt}" oninput="updateCustomRT('${eq.id}', this.value)" ${inputState}
                            class="w-14 sm:w-16 text-right bg-gray-100 border border-gray-300 rounded px-1.5 py-1 text-[10px] sm:text-xs font-bold text-gray-900 focus:outline-none focus:ring-1 focus:ring-petronas-main focus:bg-white transition-all placeholder-gray-400" />
                        <span class="text-[9px] sm:text-[10px] font-bold text-gray-400">RT</span>
                    </div>`;
                }

                const btnClass = isOn 
                    ? 'bg-petronas-main text-white shadow-md hover:bg-petronas-dark' 
                    : 'bg-gray-200 text-gray-500 hover:bg-gray-300';
                
                const cardClass = isOn
                    ? 'bg-white border-gray-200 shadow-sm'
                    : 'bg-gray-50 border-gray-100 opacity-80';

                html += `
                <div class="flex items-center justify-between p-3 sm:p-4 rounded-lg sm:rounded-xl border ${cardClass} transition-all duration-200">
                    <div class="flex-grow">
                        <div class="font-bold text-gray-900 text-sm sm:text-base">${eq.id}</div>
                        <div class="text-[10px] sm:text-xs text-gray-500 mt-0.5">${loadText}</div>
                    </div>
                    
                    <div class="flex items-center">
                        ${rtInputHtml}
                        <button onclick="toggleEq('${eq.id}')" class="px-3 sm:px-4 py-1.5 sm:py-2 rounded-md sm:rounded-lg font-bold text-[11px] sm:text-xs transition-all duration-200 w-14 sm:w-16 flex-shrink-0 ${btnClass}">
                            ${isOn ? 'ON' : 'OFF'}
                        </button>
                    </div>
                </div>`;
            });
            
            html += `</div></div>`;
            return html;
        }

        function renderEquipment() {
            const container = document.getElementById('equipment-container');
            container.innerHTML = 
                renderCategory("Electric Centrifugal Chillers (ECC)", "ECC") +
                renderCategory("Steam Absorption Chillers (SAC)", "SAC") +
                renderCategory("Direct Fired Chillers (DFC)", "DFC") +
                renderCategory("Gas Turbine Generators (GTG)", "Generator") +
                renderCategory("Auxiliary Gas Boilers (AGB)", "Boiler") +
                renderCategory("Secondary Distribution Pumps", "SecPump") +
                renderCategory("Base Facility Load", "Fixed");
        }

        window.onload = () => {
            applyYearDefaults(currentYear); 
            renderDemandFilters();
            renderYearButtons();
            renderEquipment();
            calculateKPIs();
        };
    </script>
</body>
</html>
